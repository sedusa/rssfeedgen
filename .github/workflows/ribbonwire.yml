name: Ribbonwire hourly feed
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['giftfeed.py', '.github/workflows/ribbonwire.yml']
permissions:
  contents: write
concurrency:
  group: ribbonwire-rss
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: python giftfeed.py
      - name: Publish the feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ribbonwire.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Ribbonwire feed'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
